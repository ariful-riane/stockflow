{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <script>
        (() => {
            const storedTheme =
                localStorage.getItem("stockflow-theme") || "auto";

            const systemTheme =
                window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            
            const initialTheme =
                storedTheme === "auto" ? systemTheme : storedTheme;

            document.documentElement.setAttribute("data-bs-theme", initialTheme);

        })();
    </script>

    <title>{% block title %}StockFlow{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'inventory/css/public.css' %}">

    <link rel="stylesheet" href="{% static 'inventory/css/app.css' %}">

</head>

<body>
    <header class="public-header sticky-top">

        <nav class="navbar stockflow-navbar py-3">
            <div class="container">

                <a class="stockflow-brand" href="{% url 'inventory:index' %}">StockFlow</a>

                <div class="ms-auto d-flex align-items-center gap-2">
                    <div class="theme-switcher" id="themeSwitcher">
                        <button
                            type="button"
                            class="mode-toggle"
                            id="themeMainButton"
                            aria-label="Change colour mode"
                            title="Change colour mode"
                        >
                            <i class="bi bi-circle-half" id="themeIcon"></i>
                        </button>

                        <div class="theme-options">
                            <button
                                type="button"
                                class="theme-option"
                                data-theme="light"
                                aria-label="Use light mode"
                                title="Light"
                            >
                                <i class="bi bi-sun-fill"></i>
                            </button>

                            <button
                                type="button"
                                class="theme-option"
                                data-theme="dark"
                                aria-label="Use dark mode"
                                title="Dark"
                            >
                                <i class="bi bi-moon-stars-fill"></i>
                            </button>

                            <button
                                type="button"
                                class="theme-option"
                                data-theme="auto"
                                aria-label="Use device theme"
                                title="Auto"
                            >
                                <i class="bi bi-circle-half"></i>
                            </button>
                        </div>
                    </div>
                    {% if user.is_authenticated %}
                        <div
                            class="nav-rotator"
                            id="navRotator"
                        >
                            <span
                                class="nav-rotator-state nav-rotator-user is-active"
                                id="navRotatorUser"
                                title="Hi, {{ user.username }}!"
                            >
                                Hi, {{ user.username }}!
                            </span>

                            <a
                                href="{% url 'inventory:product_list' %}"
                                class="nav-rotator-state nav-rotator-products"
                                id="navRotatorProducts"
                                aria-hidden="true"
                                tabindex="-1"
                            >
                                <i class="bi bi-box-seam me-1"></i>
                                Products
                            </a>

                        </div>

                        <form
                            action="{% url 'logout' %}"
                            method="post"
                            class="d-inline"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-stockflow-outline"
                            >
                                Log Out
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-stockflow-outline">Log In</a>

                        <a href="{% url 'signup' %}" class="btn btn-stockflow">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main class="public-main">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const root = document.documentElement;
        const mainButton = document.getElementById("themeMainButton");
        const themeIcon = document.getElementById("themeIcon");
        const themeOptions = document.querySelectorAll(".theme-option");

        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

        const themes = ["light", "dark", "auto"];

        const icons = {
            light: "bi-sun-fill",
            dark: "bi-moon-stars-fill",
            auto: "bi-circle-half"
        };

        const getTheme = () =>
            localStorage.getItem("stockflow-theme") || "auto";

        const setTheme = (theme, save = true) => {
            const actualTheme =
                theme === "auto"
                    ? (systemTheme.matches ? "dark" : "light")
                    : theme;
            root.setAttribute("data-bs-theme", actualTheme);

            themeIcon.className = `bi ${icons[theme]}`;

            mainButton.setAttribute(
                "aria-label",
                `Current colour mode: ${theme}`
            );

            themeOptions.forEach((button) => {
                button.hidden = button.dataset.theme === theme;
            })

            if (save){
                localStorage.setItem("stockflow-theme", theme);
            }
        };

        mainButton.addEventListener("click", (event) =>{
            const current = getTheme();
            const next =
                themes[(themes.indexOf(current) + 1) % themes.length];
            setTheme(next);

            if (event.detail > 0) {
                mainButton.blur();
            }
        });

        themeOptions.forEach((button) => {
            button.addEventListener("click", () => {
                setTheme(button.dataset.theme);
            })
        })

        systemTheme.addEventListener("change", () => {
            if (getTheme() === "auto") {
                setTheme("auto", false);
            }
        });

        setTheme(getTheme(), false);
    </script>

    <script>
        (() => {
            const navRotator = document.getElementById("navRotator");
            
            if (!navRotator) return;

            const userState = document.getElementById("navRotatorUser");

            const productsState = document.getElementById("navRotatorProducts");

            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

            let showingProducts = false;
            let rotationTimer = null;

            const showState = (showProducts) => {
                showingProducts = showProducts;

                userState.classList.toggle("is-active", !showingProducts);
                productsState.classList.toggle("is-active", showingProducts);

                userState.setAttribute("aria-hidden", showingProducts ? "true" : "false");
                productsState.setAttribute("aria-hidden", showingProducts ? "false" : "true");

                productsState.tabIndex = showingProducts ? 0 : -1;
            };

            const stopRotation = () => {
                if (rotationTimer) {
                    clearInterval(rotationTimer);
                    rotationTimer = null;
                }
            };

            const startRotation = () => {

                stopRotation();

                if (reducedMotion.matches) return;

                rotationTimer = setInterval(() => {
                    showState(!showingProducts);
                }, 4000);
            };

            const showProducts = () => {
                stopRotation();
                showState(true);
            };

            const resumeRotation = () => {
                showState(false);
                startRotation();
            };

            navRotator.addEventListener("mouseenter", showProducts);

            navRotator.addEventListener("mouseleave", resumeRotation);
            
            navRotator.addEventListener("focusin", showProducts);

            navRotator.addEventListener(
                "focusout",
                (event) => {
                    if (
                        !navRotator.contains(
                            event.relatedTarget
                        )
                    ) {
                        resumeRotation();
                    }
                }
            );

            showState(false);
            startRotation();
        })();
</script>

</body>
</html>
